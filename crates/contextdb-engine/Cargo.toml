# The SQL surface suite drives the raw sync-apply primitive
# (`Database::apply_changes` and the `ConflictPolicies` it takes), which the
# default build keeps crate-private and only the test seam opens. Declaring
# that here is what makes `cargo test -p contextdb-engine --test sql_tests`
# buildable on its own: without it the target is compiled with default
# features and dies on three private-item errors, and the suite only ever ran
# because a workspace build happens to unify the seam in from another crate.
[[test]]
name = "sql_tests"
path = "tests/sql_tests.rs"
required-features = ["test-seams"]

# The local-CREATE-TABLE wall drives the same raw sync-apply primitive so its
# control can prove the ARRIVING-DDL adopt path is untouched by the local
# refusal. `Database::apply_changes` and the `ConflictPolicies` it takes are
# crate-private in a default build, so declare the seam here for the same
# reason `sql_tests` declares it.
[[test]]
name = "a_local_create_table_never_replaces_an_existing_table"
path = "tests/a_local_create_table_never_replaces_an_existing_table.rs"
required-features = ["test-seams"]

