[package]
name = "contextdb-engine"
version = "1.0.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
description = "Embedded database engine for agentic memory — relational, graph, and vector under unified MVCC transactions"
keywords.workspace = true
categories.workspace = true

[features]
test-seams = ["contextdb-vector/test-seams"]
# Build-only validation facility used by the installed release smoke. It keeps
# the real Iroh path and exposes only two fixed crash checkpoints; it does not
# enable the broader test seam.
production-smoke-driver = ["iroh"]
sync-orchestration = [
    "dep:tokio",
]
iroh = [
    "sync-orchestration",
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:bao-tree",
    "dep:bytes",
    "dep:futures-util",
    "dep:irpc",
    "dep:iroh-tickets",
    "dep:range-collections",
    "dep:url",
    "dep:rustls-pki-types",
]
# LAN-local mDNS address lookup stays opt-in after sync orchestration moved
# into this crate. It is never enabled by the default engine/server feature set.
mdns = ["iroh", "dep:iroh-mdns-address-lookup"]
# Marker for the nightly test tier: stress/journey tests too heavy for the
# default gate build and run only under `--features nightly-tests`, executed
# by .github/workflows/nightly.yml on a daily schedule.
nightly-tests = []

[dependencies]
contextdb-core = { path = "../contextdb-core", version = "1.0" }
contextdb-tx = { path = "../contextdb-tx", version = "1.0" }
contextdb-relational = { path = "../contextdb-relational", version = "1.0" }
contextdb-graph = { path = "../contextdb-graph", version = "1.0" }
contextdb-vector = { path = "../contextdb-vector", version = "1.0" }
contextdb-parser = { path = "../contextdb-parser", version = "1.0" }
contextdb-planner = { path = "../contextdb-planner", version = "1.0" }
roaring.workspace = true
uuid.workspace = true
parking_lot.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
tracing.workspace = true
redb = { workspace = true }
bincode = { workspace = true }
smallvec = "1"
time.workspace = true
tempfile.workspace = true
fs2 = "0.4"
libc = "0.2"
blake3 = "1"
tokio = { workspace = true, optional = true }
thiserror.workspace = true
iroh = { version = "1.0.2", optional = true, default-features = false, features = ["tls-ring", "metrics"] }
iroh-blobs = { version = "0.103.0", optional = true, default-features = false }
bao-tree = { version = "0.16", optional = true, default-features = false, features = ["experimental-mixed", "tokio_fsm", "validate", "serde"] }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
irpc = { version = "0.17.0", optional = true, default-features = false, features = ["spans", "stream", "derive", "varint-util"] }
iroh-tickets = { version = "1.0.0", optional = true }
range-collections = { version = "0.4.6", optional = true, features = ["serde"] }
url = { version = "2", optional = true }
rustls-pki-types = { version = "1", optional = true }
ed25519-dalek = "2"
getrandom = "0.3"
# LAN-local address lookup for `lookup=mdns`; enabled only by `mdns` above.
iroh-mdns-address-lookup = { version = "0.4", optional = true }

[dev-dependencies]
contextdb-server = { path = "../contextdb-server", features = ["test-seams"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
num_cpus = "1.16"
criterion = { version = "0.8", features = ["html_reports"] }
regex = "1"
tracing-subscriber = "0.3"
serial_test = "3"
syn = { version = "2", features = ["full", "visit"] }

[[test]]
name = "integration"
path = "../../tests/integration.rs"

[[test]]
name = "acceptance"
path = "../../tests/acceptance.rs"

