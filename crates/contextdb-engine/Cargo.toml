[package]
name = "contextdb-engine"
version = "1.0.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
description = "Embedded database engine for agentic memory — relational, graph, and vector under unified MVCC transactions"
keywords.workspace = true
categories.workspace = true

[features]
test-seams = ["contextdb-vector/test-seams"]
# Marker for the demoted broker-bound test modules: the deprecated NATS
# transport suites build and run only under `--features nats-tests` (with a
# Docker daemon). The default `cargo test --workspace` gate needs no broker.
nats-tests = ["contextdb-server/nats"]
# Marker for the nightly test tier: stress/journey tests too heavy for the
# default gate build and run only under `--features nightly-tests`, executed
# by .github/workflows/nightly.yml on a daily schedule.
nightly-tests = []

[dependencies]
contextdb-core = { path = "../contextdb-core", version = "1.0" }
contextdb-tx = { path = "../contextdb-tx", version = "1.0" }
contextdb-relational = { path = "../contextdb-relational", version = "1.0" }
contextdb-graph = { path = "../contextdb-graph", version = "1.0" }
contextdb-vector = { path = "../contextdb-vector", version = "1.0" }
contextdb-parser = { path = "../contextdb-parser", version = "1.0" }
contextdb-planner = { path = "../contextdb-planner", version = "1.0" }
roaring.workspace = true
uuid.workspace = true
parking_lot.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
redb = { workspace = true }
bincode = { workspace = true }
smallvec = "1"
time.workspace = true
fs2 = "0.4"
blake3 = "1"

[dev-dependencies]
contextdb-server = { path = "../contextdb-server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
async-nats.workspace = true
testcontainers = "0.27"
tempfile = "3"
num_cpus = "1.16"
criterion = { version = "0.8", features = ["html_reports"] }
regex = "1"
tracing-subscriber = "0.3"
serial_test = "3"

[[test]]
name = "integration"
path = "../../tests/integration.rs"

[[test]]
name = "acceptance"
path = "../../tests/acceptance.rs"

