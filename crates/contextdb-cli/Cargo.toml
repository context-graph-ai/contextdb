[package]
name = "contextdb-cli"
version = "1.0.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
description = "Interactive CLI for contextdb — explore relational, graph, and vector queries in a REPL"
keywords.workspace = true
categories.workspace = true

[lib]
name = "contextdb_cli"
path = "src/lib.rs"

[[bin]]
name = "contextdb"
path = "src/main.rs"

[features]
# The internal test seam (`contextdb_cli::testing`). Off by default, so a
# downstream build of this crate cannot see or call the CLI's internals. The
# self-dependency below turns it on for this crate's OWN test targets, which is
# what lets the seam tests run in the default `cargo test -p contextdb-cli` gate
# without the module existing for anyone else.
test-seams = []

[dependencies]
contextdb-engine = { path = "../contextdb-engine", version = "1.0" }
contextdb-core = { path = "../contextdb-core", version = "1.0" }
contextdb-server = { path = "../contextdb-server", version = "1.0", features = ["iroh"] }
# Parses an executed statement's own text back into its AST so the CLI's
# per-line path can recognize CREATE SINK/CREATE SCHEDULE and register its
# own default delivery/cron callbacks (see `feed_line`/`execute_sql` in
# `repl.rs`) -- a real dependency now, not just a test one.
contextdb-parser = { path = "../contextdb-parser", version = "1.0" }
rustyline.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
uuid.workspace = true
# Depending on ourselves with `test-seams` on enables the feature when Cargo
# builds this crate's test targets, and only then.
contextdb-cli = { path = ".", features = ["test-seams"] }
# Integration tests host a real ticketed-Iroh hub through the server's
# feature-gated test seam; the normal CLI dependency above remains unchanged.
contextdb-server = { path = "../contextdb-server", features = ["test-seams"] }
