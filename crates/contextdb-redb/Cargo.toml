[package]
name = "contextdb-redb"
version = "4.1.0"
edition = "2024"
rust-version = "1.89"
autotests = false
license = "MIT OR Apache-2.0"
description = "Maintained redb 4.1.0 fork for ContextDB"
repository = "https://github.com/context-graph-ai/contextdb"

[lib]
name = "redb"

[dependencies]
log = { version = "0.4.17", optional = true }
chrono_v0_4 = { package = "chrono", version = "0.4.41", optional = true }
uuid = { version = "1.17.0", optional = true }

[target.'cfg(target_os = "wasi")'.dependencies]
libc = "0.2.174"

[features]
logging = ["dep:log"]
cache_metrics = []
test-seams = []

[dev-dependencies]
bincode = "2.0.1"
rand = "0.10.1"
redb2_6 = { package = "redb", version = "=2.6.0" }
tempfile = "3.5.0"
uuid = { version = "1.17.0", features = ["v4"] }

[[test]]
name = "backward_compatibility"
path = "tests/backward_compatibility.rs"

[[test]]
name = "basic_tests"
path = "tests/basic_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "multimap_tests"
path = "tests/multimap_tests.rs"

[[test]]
name = "multithreading_tests"
path = "tests/multithreading_tests.rs"

[lints.clippy]
big_endian_bytes = "deny"
dbg_macro = "deny"
host_endian_bytes = "deny"

[package.metadata.upstream]
version = "4.1.0"
registry-checksum = "8e925444704b5f17d32bf42f5b6e2df050bceebc3dcd6e71cc73dafe8092e839"
