name: CI

on:
  push:
    branches: [main, dev, linux-bounded-storage-candidate-20261019]
    paths:
      - 'crates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/ci-continuity.py check
      - run: python3 scripts/ci-continuity-tests.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --manifest-path crates/contextdb-redb/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/contextdb-redb/Cargo.toml --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --manifest-path crates/contextdb-redb/Cargo.toml --locked
      - run: cargo build --release
      # The packaged engine builds alone with default features, where feature-gated transport
      # and test-support code is unused; its dead-code warnings are not errors in this step.
      - env:
          RUSTFLAGS: ""
        run: bash scripts/verify-packaged-engine.sh

  installed-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install release binaries into an isolated root
        run: |
          install_root="$RUNNER_TEMP/contextdb-installed"
          cargo install --locked --path crates/contextdb-cli --root "$install_root"
          cargo install --locked --path crates/contextdb-server --root "$install_root" \
            --features production-smoke-driver --bins
      - name: Run installed release durability smoke
        run: |
          install_root="$RUNNER_TEMP/contextdb-installed"
          CONTEXTDB_CLI="$install_root/bin/contextdb" \
          CONTEXTDB_SMOKE_DRIVER="$install_root/bin/contextdb-smoke-driver" \
          CONTEXTDB_SERVER="$install_root/bin/contextdb-server" \
            scripts/installed-release-durable-sync-smoke.sh

  cross-compile:
    needs: lint
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }} -p contextdb-cli -p contextdb-server

  required:
    needs: [lint, test, installed-smoke, cross-compile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every correctness job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-continuity.py aggregate lint test installed-smoke cross-compile
