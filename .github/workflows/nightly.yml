name: Nightly

# One full-suite producer per schedule/manual trigger. PRs call only additional
# nightly feature fixtures on their own SHA; default PR shards stay in ci.yml.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test:
    uses: ./.github/workflows/integration.yml
    with:
      enabled: true
      run_default: true
      gate_mode: full
