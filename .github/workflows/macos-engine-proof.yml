name: macOS engine qualification
on:
  push:
    branches: [ci-macos-reader-auth-proof]
permissions:
  contents: read
concurrency:
  group: macos-engine-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-qualification:
    if: github.repository == 'context-graph-ai/contextdb' && github.ref == 'refs/heads/ci-macos-reader-auth-proof' && github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: '1.94.1'
      RUSTFLAGS: ''
      VERIFIER_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.94.1'
          cache: false
          rustflags: ''
      - name: Execute exact native engine selection
        run: python3 scripts/ci-macos-engine-proof.py
      - name: Upload focused native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-engine-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/macos-engine-proof/
          retention-days: 14
          if-no-files-found: error
