# The module order of contextdb, checked by cargo-strata in the lint job. Each module may use only
# the modules above it:
# types < memory < system < settings < store < sql < schema < vector < query < events < stage
# < commit < maintenance < reader < erase < database
check_dev = true

[[crate]]
name = "contextdb"
allow = []
# No outside library is re-exported but the two the first program names: `Uuid` and `serde_json`.
deny_reexport = ["redb", "serde", "serde_json", "uuid", "pest", "pest_derive", "lz4_flex", "libc"]
allow_reexport = ["Uuid", "serde_json"]

[[crate.module]]
path = "types"
deny = ["memory", "system", "settings", "store", "sql", "schema", "vector", "query", "events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "memory"
deny = ["system", "settings", "store", "sql", "schema", "vector", "query", "events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "system"
deny = ["settings", "store", "sql", "schema", "vector", "query", "events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "settings"
deny = ["store", "sql", "schema", "vector", "query", "events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "store"
deny = ["sql", "schema", "vector", "query", "events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "sql"
deny = ["schema", "vector", "query", "events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "schema"
deny = ["vector", "query", "events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "vector"
deny = ["query", "events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "query"
deny = ["events", "stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "events"
deny = ["stage", "commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "stage"
deny = ["commit", "maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "commit"
deny = ["maintenance", "reader", "erase", "database"]

[[crate.module]]
path = "maintenance"
deny = ["reader", "erase", "database"]

[[crate.module]]
path = "reader"
deny = ["erase", "database"]

[[crate.module]]
path = "erase"
deny = ["database"]

[[crate.module]]
path = "database"
deny = []

# a top-level module with no entry of its own may use nothing
[[crate.module]]
path = "*"
depends_on = []

[[forbid]]
name = "no-include-no-extern-crate"
patterns = ["include", "extern crate"]
allow = []
crates = ["contextdb"]

[[forbid]]
name = "lib-root-holds-no-code"
patterns = ["fn", "impl", "struct", "enum", "trait", "const", "static", "type"]
allow = ["contextdb/src/*/**", "contextdb/src/settings.rs"]
crates = ["contextdb"]

# Each outside library is named only by the part that owns it, in the engine, its tests and its
# examples. `dirs = ["."]` is the one setting that reaches tests/ and examples/. A `pub(crate)`
# item in store whose signature names a storage-library type is not caught here; that needs a
# signature rule the checker does not have yet.
[[forbid]]
name = "redb-only-in-store"
patterns = ["redb"]
allow = ["contextdb/src/store/**", "contextdb/tests/support/raw.rs"]
crates = ["contextdb"]
dirs = ["."]

[[forbid]]
name = "pest-only-in-the-sql-parser"
patterns = ["pest", "pest_derive"]
allow = ["contextdb/src/sql/parser/**"]
crates = ["contextdb"]
dirs = ["."]

[[forbid]]
name = "lz4-only-in-store-records"
patterns = ["lz4_flex"]
allow = ["contextdb/src/store/record.rs", "contextdb/src/store/tests.rs"]
crates = ["contextdb"]
dirs = ["."]

[[forbid]]
name = "libc-only-in-system"
patterns = ["libc"]
allow = ["contextdb/src/system/**"]
crates = ["contextdb"]
dirs = ["."]
