# A test that runs past its limit is stopped and fails by name. Nothing is retried.
# The default profile leaves the million-row load, the million-row append and the two scale
# cases to the nightly and release profiles; the consumer performance bars run in release.
# The event-route kill test runs in release: one sink call is one fsync by design, 3,584 of them.
[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }
default-filter = 'not (test(=a_million_rows_load_and_scan_under_64_mib) | test(=an_append_does_not_read_the_rows_stored_before_it_at_a_million_rows) | test(=a_hundred_thousand_sightings_are_found_with_the_recorded_work_recall_and_length) | test(=a_million_sightings_are_found_with_the_recorded_work_recall_and_length) | binary(=performance_bars) | test(streaming::) | test(=removal_membership_agrees_with_the_in_memory_evaluator_for_every_kind) | test(=purge::a_purge_leaves_no_copy_in_either_commit_slot) | test(=the_same_rows_in_more_commits_end_at_the_same_size) | test(=a_kill_in_any_step_of_a_build_leaves_every_vector_found) | test(=a_kill_in_a_commit_with_an_event_route_keeps_rows_and_actions_together) | test(=store::tests::every_damaged_record_is_told_as_damage_by_each_path_that_meets_it) | test(=schema::tests::every_damaged_schema_record_is_told_as_damage_or_read_as_tables_that_print) | test(=a_bound_finds_what_is_stored_and_nothing_for_a_face_never_stored) | test(=a_bound_over_sightings_answers_rows_inside_it_however_asked_or_written))'

# The kill-and-reopen tests start this test program again for each storage call they cut, copy a
# store, fsync it and search it over: they spend processes, disk and the build host's cores, which
# 32 test threads stretch past the limit. Four of them run together, each holding two slots (its
# own and its child's), so a wide run leaves them the same share of the host however many other
# tests run. The default and release profiles carry it; the nightly one runs no crash test.
[test-groups.crash]
max-threads = 4

[[profile.default.overrides]]
filter = 'binary(=crash)'
test-group = 'crash'
threads-required = 2

# The nightly profile runs only the million-row load and the million-row append. Its limit is a
# hang detector, well clear of the slowest hosted run seen (428 seconds).
[profile.nightly]
retries = 0
default-filter = 'test(=a_million_rows_load_and_scan_under_64_mib) | test(=an_append_does_not_read_the_rows_stored_before_it_at_a_million_rows)'
slow-timeout = { period = "300s", terminate-after = 6 }

[[profile.release.overrides]]
filter = 'binary(=crash)'
test-group = 'crash'
threads-required = 2

# Only cargo-mutants stops a slow mutant; nextest reports progress without judging speed.
[profile.mutants]
retries = 0
slow-timeout = { period = "300s" }

# Scale cases, the memory ceiling and consumer performance bars share a release build and the nightly hang limit.
[profile.release]
retries = 0
slow-timeout = { period = "300s", terminate-after = 6 }
default-filter = 'test(=a_million_rows_load_and_scan_under_64_mib) | test(=a_hundred_thousand_sightings_are_found_with_the_recorded_work_recall_and_length) | test(=a_million_sightings_are_found_with_the_recorded_work_recall_and_length) | test(=an_append_does_not_read_the_rows_stored_before_it_at_a_million_rows) | binary(=performance_bars) | test(=a_killed_open_reads_the_log_and_last_commit_pages) | test(streaming::) | test(=removal_membership_agrees_with_the_in_memory_evaluator_for_every_kind) | test(=purge::a_purge_leaves_no_copy_in_either_commit_slot) | test(=the_same_rows_in_more_commits_end_at_the_same_size) | test(=a_kill_in_any_step_of_a_build_leaves_every_vector_found) | test(=a_kill_in_a_commit_with_an_event_route_keeps_rows_and_actions_together) | test(=store::tests::every_damaged_record_is_told_as_damage_by_each_path_that_meets_it) | test(=schema::tests::every_damaged_schema_record_is_told_as_damage_or_read_as_tables_that_print) | test(=a_bound_finds_what_is_stored_and_nothing_for_a_face_never_stored) | test(=a_bound_over_sightings_answers_rows_inside_it_however_asked_or_written)'
