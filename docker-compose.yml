services:
  contextdb-server:
    # To build from source instead: docker compose build
    image: ghcr.io/context-graph-ai/contextdb-server:latest
    build: .
    # `contextdb-server` is the image's ENTRYPOINT and takes its configuration
    # from flags. Of the three settings below only the database path has an
    # environment name (`CONTEXTDB_DB_PATH`); `--tenant-id` is required and
    # `--sync-endpoint` has no environment form at all, so both must be passed
    # here or the container exits 2 before it serves. See docs/cli.md,
    # "The environment is not a behavior surface."
    #
    # Dial-by-key sync endpoint. The identity key persists on the mounted
    # volume so the server keeps the same cryptographic identity across
    # restarts. Port 4433/udp carries the sync traffic.
    # NOTE: /data/fabric-identity.key is a SECRET — back up the volume and
    # never commit or share the key; losing it invalidates issued tickets.
    command:
      - "--db-path=/data/server.db"
      - "--tenant-id=default"
      - "--sync-endpoint=iroh:?identity=/data/fabric-identity.key&port=4433"
    ports:
      - "4433:4433/udp"
    volumes:
      - contextdb-data:/data
    restart: unless-stopped
    # The enrollment ticket edges paste into `--sync-endpoint` is printed to the
    # container logs on startup: `docker compose logs contextdb-server`.

volumes:
  contextdb-data:
